# Coxswain attack-surface register.
#
# This file is the deterministic spine of `/security-audit`. The audit does not
# decide what to look at — it reads this list and returns a verdict for every
# row. That is the whole mechanism: as long as "what to examine" is inferred by a
# model at runtime, two audits sample different subsets of 130k lines and produce
# incomparable reports. Move the enumeration into data and the only remaining
# variance is per-row judgement, which is stable and, crucially, diffable.
#
# `verdict: unverified` is a first-class answer and must carry a `why`. A row
# that was not examined has to say so — silence would read identically to safe.
#
# Rows are appended by the audit's drift phase, never by hand alone: if a new
# listener, RPC, tenant-writable field, RBAC verb, or secret-bearing wire field
# exists in the code and not here, that is a finding about this file.

schema: 1
audited_at: 78a2d363          # commit of the last full pass
audited_on: 2026-07-29

boundaries:
  TB1: internet → data plane (HTTP, gRPC, TCP, TLS, UDP)
  TB2: tenant namespace → cluster-privileged control plane
  TB3: pod network → management and control ports
  TB4: controller ↔ proxy / relay (discovery fabric)
  TB5: proxy → upstream backend
  TB6: build and release supply chain

adversaries:
  AC1: anonymous network client reaching a data-plane listener
  AC2: tenant holding create-rights in exactly one namespace
  AC3: pod running in the cluster with zero Kubernetes RBAC
  AC4: compromised proxy or relay pod
  AC5: compromised controller pod
  AC6: supply chain or maintainer

assets:
  A1: private keys — TLS server keys, discovery CA, cluster Secrets
  A2: cross-tenant traffic integrity and authentication
  A3: availability of a shared data or control plane
  A4: disclosure and reconnaissance

surfaces:

  # ── TB1 internet → data plane ─────────────────────────────────────────────

  - id: http-header-trust
    boundary: TB1
    entry: inbound HTTP request headers reaching the backend
    anchors: [crates/coxswain-proxy/src/filters/header.rs, crates/coxswain-proxy/src/hooks.rs]
    adversaries: [AC1]
    assets: [A2]
    asks:
      - which client-settable headers does the backend treat as proxy-authoritative
      - is every one of them stripped before the check that would set it runs
      - does the strip list cover ext_authz allowedResponseHeaders and JWT claim destinations
    verdict: safe
    evidence: filters/header.rs:20-42 strips x-forwarded-proto, x-real-ip, x-ssl-client-cert; policy/auth.rs:39-45 and :886 strip configured destinations before the check
    audited: 78a2d363

  - id: http-client-ip
    boundary: TB1
    entry: X-Forwarded-For / configured forwarded header
    anchors: [crates/coxswain-proxy/src/policy/access_control.rs]
    adversaries: [AC1]
    assets: [A2]
    asks:
      - is the header honoured only when the L4 peer is a configured trusted proxy
      - which tokens are skipped during the rightmost-untrusted walk, and can a client control the first non-skipped one
      - is the empty trusted set fail-closed
    verdict: finding
    findings: [731]
    evidence: access_control.rs:60-73 skips PRIVATE_NETS as well as trusted hops, so a privately-addressed client's forged token is returned
    audited: 78a2d363

