# GRPCRoute + IpAccessControl ExtensionRef with missing CR (apply backends::GRPC_ECHO first).
#
# A GRPCRoute references an IpAccessControl CR that does not exist. Per
# GEP-1364 the reflector must fail closed (#689): the rule installs as a 500
# error route rather than silently admitting traffic with no IP filtering.
#
# Gateway: coxswain-grpc-noipac on GATEWAY_HTTP_PORT.
# Route host: grpc-noipac.TESTNS.local, GrpcEcho/Echo -> grpc-echo:50051 (never reached).
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: coxswain-grpc-noipac
spec:
  gatewayClassName: coxswain
  listeners:
    - name: http
      port: ${GATEWAY_HTTP_PORT}
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-noipac-route
spec:
  hostnames:
    - "grpc-noipac.${TESTNS}.local"
  parentRefs:
    - name: coxswain-grpc-noipac
  rules:
    - matches:
        - method:
            type: Exact
            service: gateway_api_conformance.echo_basic.grpcecho.GrpcEcho
            method: Echo
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.coxswain-labs.dev
            kind: IpAccessControl
            name: does-not-exist
      backendRefs:
        - name: grpc-echo
          port: 50051
