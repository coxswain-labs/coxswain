# GRPCRoute + RetryPolicy ExtensionRef with missing CR (apply backends::GRPC_ECHO first).
#
# A GRPCRoute references a RetryPolicy CR that does not exist. Per GEP-1364 the
# reflector must fail closed (#689): the rule installs as a 500 error route
# rather than silently serving with retries disabled.
#
# Gateway: coxswain-grpc-noretry on GATEWAY_HTTP_PORT.
# Route host: grpc-noretry.TESTNS.local, GrpcEcho/Echo -> grpc-echo:50051 (never reached).
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: coxswain-grpc-noretry
spec:
  gatewayClassName: coxswain
  listeners:
    - name: http
      port: ${GATEWAY_HTTP_PORT}
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-noretry-route
spec:
  hostnames:
    - "grpc-noretry.${TESTNS}.local"
  parentRefs:
    - name: coxswain-grpc-noretry
  rules:
    - matches:
        - method:
            type: Exact
            service: gateway_api_conformance.echo_basic.grpcecho.GrpcEcho
            method: Echo
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.coxswain-labs.dev
            kind: RetryPolicy
            name: does-not-exist
      backendRefs:
        - name: grpc-echo
          port: 50051
