# CoxswainExternalAuth ExtensionRef with missing CR fixture (apply backends::ECHO first).
#
# An HTTPRoute references a CoxswainExternalAuth CR that does not exist. Per
# GEP-1364 the reflector must fail closed (#689): the rule installs as a 500
# error route rather than silently admitting traffic with no ext-auth check.
#
# Gateway: coxswain-test-noextauth on GATEWAY_HTTP_PORT.
# Route host: gwnoextauth.TESTNS.local, path /extauth/ -> echo-a:3000 (never reached).
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: coxswain-test-noextauth
spec:
  gatewayClassName: coxswain
  listeners:
    - name: http
      port: ${GATEWAY_HTTP_PORT}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: noextauth-route
spec:
  parentRefs:
    - name: coxswain-test-noextauth
  hostnames:
    - "gwnoextauth.${TESTNS}.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /extauth/
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.coxswain-labs.dev
            kind: ExternalAuth
            name: does-not-exist
      backendRefs:
        - name: echo-a
          port: 3000
