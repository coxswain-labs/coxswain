# JwtAuth ExtensionRef with missing CR fixture (apply backends::ECHO first).
#
# An HTTPRoute references a JwtAuth CR that does not exist. Per GEP-1364 the
# reflector must fail closed (#689): the rule installs as a 500 error route
# rather than silently admitting traffic with no auth enforced.
#
# Gateway: coxswain-test-nojwtauth on GATEWAY_HTTP_PORT.
# Route host: gwnojwtauth.TESTNS.local, path /jwtauth/ -> echo-a:3000 (never reached).
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: coxswain-test-nojwtauth
spec:
  gatewayClassName: coxswain
  listeners:
    - name: http
      port: ${GATEWAY_HTTP_PORT}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nojwtauth-route
spec:
  parentRefs:
    - name: coxswain-test-nojwtauth
  hostnames:
    - "gwnojwtauth.${TESTNS}.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /jwtauth/
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.coxswain-labs.dev
            kind: JwtAuth
            name: does-not-exist
      backendRefs:
        - name: echo-a
          port: 3000
