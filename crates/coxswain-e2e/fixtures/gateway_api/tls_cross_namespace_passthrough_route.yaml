# Cross-namespace TLSRoute passthrough fixture (route-side, #691).
# TESTNS   = primary namespace (where the Gateway and TLSRoute live)
# TENANTNS = tenant namespace (where the echo-tls backend Service lives)
#
# The backendRef crosses into TENANTNS; it only resolves when a
# TLSRoute → Service ReferenceGrant in TENANTNS permits it (see
# tls_cross_namespace_passthrough_tenant.yaml /
# tls_cross_namespace_passthrough_tenant_wrong_kind.yaml).
#
# Substitutions (via FixtureVars::with), same as gwa::TLS_PASSTHROUGH:
#   GATEWAY_TLS_PASSTHROUGH_PORT - port for the passthrough listener
#   PASSTHROUGH_HOSTNAME         - SNI hostname for the TLSRoute rule
#   TENANTNS                     - namespace of the echo-tls backend
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: coxswain-passthrough-xns-gw
  namespace: ${TESTNS}
spec:
  gatewayClassName: coxswain
  listeners:
    - name: tls-passthrough
      port: ${GATEWAY_TLS_PASSTHROUGH_PORT}
      protocol: TLS
      hostname: "${PASSTHROUGH_HOSTNAME}"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: tls-passthrough-xns-route
  namespace: ${TESTNS}
spec:
  parentRefs:
    - name: coxswain-passthrough-xns-gw
      namespace: ${TESTNS}
  hostnames:
    - "${PASSTHROUGH_HOSTNAME}"
  rules:
    - backendRefs:
        - name: echo-tls
          namespace: ${TENANTNS}
          port: 8443
