# Cross-namespace CoxswainExternalAuth: route-side fixture (apply to TESTNS,
# after backends::ECHO and backends::AUTH_STUB applied to TENANTNS).
#
# The CoxswainExternalAuth CR's backendRef points at auth-allow in TENANTNS;
# resolving it requires a matching CoxswainExternalAuth -> Service
# ReferenceGrant in TENANTNS (supplied by gwa::EXTERNAL_AUTH_XNS_TENANT).
# Without the grant the proxy fails closed (503) regardless of the auth
# service's actual verdict (#691 — this backendRef used to be checked against
# the HTTPRoute grant set, so the documented CoxswainExternalAuth-kind grant
# never matched and the reference was permanently denied).
#
# TENANTNS = namespace holding the auth-allow backend + ReferenceGrant.
# Gateway: coxswain-extauth-xns on GATEWAY_HTTP_PORT.
# Route host: gwextauthxns.TESTNS.local, path / -> echo-a:3000.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: coxswain-extauth-xns
spec:
  gatewayClassName: coxswain
  listeners:
    - name: http
      port: ${GATEWAY_HTTP_PORT}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.coxswain-labs.dev/v1alpha1
kind: CoxswainExternalAuth
metadata:
  name: extauth-xns
spec:
  protocol: HTTP
  backendRef:
    name: auth-allow
    namespace: ${TENANTNS}
    port: 4000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: extauth-xns-route
spec:
  parentRefs:
    - name: coxswain-extauth-xns
  hostnames:
    - "gwextauthxns.${TESTNS}.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.coxswain-labs.dev
            kind: ExternalAuth
            name: extauth-xns
      backendRefs:
        - name: echo-a
          port: 3000
