# Cross-namespace TLSRoute passthrough: tenant-side grant (#691, apply to
# TENANTNS after backends::ECHO_TLS).
#
# Permits a TLSRoute in TESTNS to reference a Service in this namespace.
# Pair with gwa::TLS_CROSS_NAMESPACE_PASSTHROUGH_ROUTE applied to TESTNS.
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-tlsroute-from-${TESTNS}
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: TLSRoute
      namespace: ${TESTNS}
  to:
    - group: ""
      kind: Service
