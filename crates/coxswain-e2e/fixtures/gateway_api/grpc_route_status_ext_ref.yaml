# Gateway + two GRPCRoutes, both with a resolvable backend (#689/GEP-1364).
#
# good-grpc-route: backendRef grpc-echo:50051, no ExtensionRef →
#   Accepted=True, ResolvedRefs=True.
# ext-ref-ghost-grpc-route: backendRef grpc-echo:50051 + dangling RateLimit
#   ExtensionRef → Accepted=True, ResolvedRefs=False(InvalidKind).
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: coxswain-grpc-status-extref-gw
spec:
  gatewayClassName: coxswain
  listeners:
    - name: http
      port: ${GATEWAY_HTTP_PORT}
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: good-grpc-route
spec:
  parentRefs:
    - name: coxswain-grpc-status-extref-gw
  rules:
    - backendRefs:
        - name: grpc-echo
          port: 50051
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: ext-ref-ghost-grpc-route
spec:
  parentRefs:
    - name: coxswain-grpc-status-extref-gw
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.coxswain-labs.dev
            kind: RateLimit
            name: does-not-exist
      backendRefs:
        - name: grpc-echo
          port: 50051
