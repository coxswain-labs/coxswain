# IpAccessControl ExtensionRef with missing CR fixture (apply backends::ECHO first).
#
# An HTTPRoute references an IpAccessControl CR that does not exist. Per
# GEP-1364 the reflector must fail closed (#689): the rule installs as a 500
# error route rather than silently admitting traffic with no IP filtering.
#
# Gateway: coxswain-test-noipac on GATEWAY_HTTP_PORT.
# Route host: gwnoipac.TESTNS.local, path /ipac/ -> echo-a:3000 (never reached).
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: coxswain-test-noipac
spec:
  gatewayClassName: coxswain
  listeners:
    - name: http
      port: ${GATEWAY_HTTP_PORT}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: noipac-route
spec:
  parentRefs:
    - name: coxswain-test-noipac
  hostnames:
    - "gwnoipac.${TESTNS}.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ipac/
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.coxswain-labs.dev
            kind: IpAccessControl
            name: does-not-exist
      backendRefs:
        - name: echo-a
          port: 3000
