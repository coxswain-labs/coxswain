# Route-status ExtensionRef-resolution fixture (#689/GEP-1364).
#
# One Gateway, two HTTPRoutes that attach to it, both with a healthy backend:
#   good-route      → echo-a, no ExtensionRef             → ResolvedRefs=True
#   ext-ref-ghost-route → echo-a + dangling RateLimit ref  → ResolvedRefs=False/InvalidKind
#
# Both routes attach to the listener (Accepted=True) and resolve their
# backendRef; they differ only in whether their ExtensionRef target exists,
# isolating the #689 ResolvedRefs assertion from backend-ref resolution.
# TESTNS is substituted with the test namespace at runtime.
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: coxswain-test-extref
spec:
  gatewayClassName: coxswain
  listeners:
    - name: http
      port: ${GATEWAY_HTTP_PORT}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: good-route
spec:
  parentRefs:
    - name: coxswain-test-extref
  hostnames:
    - "good.${TESTNS}.local"
  rules:
    - backendRefs:
        - name: echo-a
          port: 3000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ext-ref-ghost-route
spec:
  parentRefs:
    - name: coxswain-test-extref
  hostnames:
    - "extrefghost.${TESTNS}.local"
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.coxswain-labs.dev
            kind: RateLimit
            name: does-not-exist
      backendRefs:
        - name: echo-a
          port: 3000
