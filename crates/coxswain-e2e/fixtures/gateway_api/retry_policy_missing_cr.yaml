# RetryPolicy ExtensionRef with missing CR fixture (apply backends::ECHO first).
#
# An HTTPRoute references a RetryPolicy CR that does not exist. Per GEP-1364 the
# reflector must fail closed (#689): the rule installs as a 500 error route
# rather than silently serving with retries disabled.
#
# Gateway: coxswain-test-noretry on GATEWAY_HTTP_PORT.
# Route host: gwnoretry.TESTNS.local, path /retry/ -> echo-a:3000 (never reached).
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: coxswain-test-noretry
spec:
  gatewayClassName: coxswain
  listeners:
    - name: http
      port: ${GATEWAY_HTTP_PORT}
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: noretry-route
spec:
  parentRefs:
    - name: coxswain-test-noretry
  hostnames:
    - "gwnoretry.${TESTNS}.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /retry/
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.coxswain-labs.dev
            kind: RetryPolicy
            name: does-not-exist
      backendRefs:
        - name: echo-a
          port: 3000
