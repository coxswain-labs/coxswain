openapi: 3.1.0
info:
  title: Coxswain Operator Admin API
  version: 0.1.0
  description: >-
    **Internal** HTTP surface served by `coxswain-admin` on the controller's
    admin port (default 8082). It backs the embedded operator UI and is not a
    stable public contract — this spec is a developer aid that tracks the
    dispatch in `crates/coxswain-admin/src/lib.rs` and the handlers in
    `aggregator.rs`. Keep it in sync when those change.

    Two axes plus cross-cutting endpoints (issue #301):
      - `fleet/*`   — all coxswain pods (controllers + proxies)
      - `routing/*` — config resources (Gateways, HTTPRoutes, Ingresses)

    This surface lives on the controller's **operator port** (8082), which the
    controller role alone binds — proxy and relay pods serve no `/api/v1/*` at
    all (#676). Their entire management surface is `/healthz` + `/readyz` on the
    health port and `/metrics` + `/statusz` on the telemetry port (8083); those
    two are documented here only where the aggregator consumes them. When
    `operatorAuth` is configured every path below requires HTTP Basic auth,
    with no exemptions. A proxy's compiled routing table is served from the
    controller's own local snapshot at `fleet/proxies/{name}/routes`, never
    fetched from the pod (#537).

servers:
  - url: http://localhost:8082
    description: Controller admin port (typically reached via kubectl port-forward)

tags:
  - name: fleet
  - name: routing
  - name: cross-cutting
  - name: role-local

paths:
  /:
    get:
      tags: [role-local]
      summary: Embedded operator UI (controller only)
      responses:
        '200': { description: HTML, content: { text/html: {} } }
        '404': { description: UI not enabled (proxy roles) }

  /metrics:
    get:
      tags: [role-local]
      summary: Prometheus metrics (all roles)
      responses:
        '200': { description: Prometheus text exposition, content: { text/plain: {} } }

  /api/v1/health:
    get:
      tags: [cross-cutting]
      summary: Pod health, version, and leadership (all roles)
      responses:
        '200':
          description: Health snapshot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  /api/v1/fleet/summary:
    get:
      tags: [fleet]
      summary: Per-category counts + worst severity for controllers and proxies
      responses:
        '200':
          description: Fleet summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  controllers: { $ref: '#/components/schemas/CategorySummary' }
                  shared_proxies: { $ref: '#/components/schemas/CategorySummary' }
                  dedicated_proxies: { $ref: '#/components/schemas/CategorySummary' }
                  all_in_sync:
                    type: boolean
                    description: >-
                      Whether every connected proxy has Ack'd the controller's
                      current snapshot. Backs the topology lag banner (#393).
                      OMITTED entirely unless the answering replica is the
                      leader: only the leader holds a populated node registry,
                      so a standby would report `true` vacuously and hide a
                      warning genuinely firing elsewhere. Treat absence as
                      "unknown" and key any banner on an explicit `false`.

  /api/v1/fleet/controllers:
    get:
      tags: [fleet]
      summary: All controller pods (liveness + leadership + health rollup)
      responses:
        '200':
          description: Controller list
          content:
            application/json:
              schema:
                type: object
                properties:
                  controllers:
                    type: array
                    items: { $ref: '#/components/schemas/PodEntry' }

  /api/v1/fleet/controllers/{name}:
    get:
      tags: [fleet]
      parameters: [{ $ref: '#/components/parameters/podName' }]
      responses:
        '200': { description: Controller pod, content: { application/json: { schema: { $ref: '#/components/schemas/PodEntry' } } } }
        '404': { description: Unknown pod }

  /api/v1/fleet/controllers/{name}/health:
    get:
      tags: [fleet]
      parameters: [{ $ref: '#/components/parameters/podName' }]
      responses:
        '200': { description: Relayed pod health, content: { application/json: { schema: { $ref: '#/components/schemas/PodHealthRelay' } } } }

  /api/v1/fleet/proxies:
    get:
      tags: [fleet]
      summary: All shared + dedicated proxy pods (liveness + health rollup)
      responses:
        '200':
          description: Proxy list
          content:
            application/json:
              schema:
                type: object
                properties:
                  proxies:
                    type: array
                    items: { $ref: '#/components/schemas/PodEntry' }

  /api/v1/fleet/proxies/{name}:
    get:
      tags: [fleet]
      parameters: [{ $ref: '#/components/parameters/podName' }]
      responses:
        '200': { description: Proxy pod, content: { application/json: { schema: { $ref: '#/components/schemas/PodEntry' } } } }
        '404': { description: Unknown pod }

  /api/v1/fleet/proxies/{name}/routes:
    get:
      tags: [fleet]
      summary: A proxy's compiled routing table, served from the controller's local snapshot (#537, filter/pagination applied there)
      parameters:
        - { $ref: '#/components/parameters/podName' }
        - { $ref: '#/components/parameters/hostQuery' }
        - { $ref: '#/components/parameters/namespaceQuery' }
        - { $ref: '#/components/parameters/pathQuery' }
        - { $ref: '#/components/parameters/status' }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
      responses:
        '200':
          description: Wrapped proxy routes, served from the controller's own snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  pod_name: { type: string }
                  routes:
                    type: object
                    properties:
                      ingress: { $ref: '#/components/schemas/RouteBlock' }
                      gateway: { $ref: '#/components/schemas/RouteBlock' }
        '404': { description: Unknown pod }

  /api/v1/fleet/proxies/{name}/facets:
    get:
      tags: [fleet]
      summary: Distinct hosts + route namespaces for a proxy's route-table filters, from the controller's local snapshot (#537)
      parameters: [{ $ref: '#/components/parameters/podName' }]
      responses:
        '200':
          description: Distinct hosts and namespaces (empty lists if the proxy's scope has no compiled routes yet)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Facets' }
        '404': { description: Unknown pod }

  /api/v1/fleet/proxies/{name}/health:
    get:
      tags: [fleet]
      parameters: [{ $ref: '#/components/parameters/podName' }]
      responses:
        '200': { description: Relayed pod health, content: { application/json: { schema: { $ref: '#/components/schemas/PodHealthRelay' } } } }

  /api/v1/routing/summary:
    get:
      tags: [routing]
      summary: Per-category counts + worst severity for the routing resources
      responses:
        '200':
          description: Routing summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  gateways: { $ref: '#/components/schemas/CategorySummary' }
                  httproutes: { $ref: '#/components/schemas/CategorySummary' }
                  ingresses: { $ref: '#/components/schemas/CategorySummary' }

  /api/v1/routing/gateways:
    get:
      tags: [routing]
      summary: Gateway list (filter/pagination envelope)
      parameters:
        - { $ref: '#/components/parameters/nameQuery' }
        - { $ref: '#/components/parameters/namespaceQuery' }
        - { $ref: '#/components/parameters/status' }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
        - { $ref: '#/components/parameters/status' }
      responses:
        '200':
          description: Gateway list envelope
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ListEnvelope' }
                  - type: object
                    properties:
                      gateways:
                        type: array
                        items: { $ref: '#/components/schemas/GatewaySummary' }

  /api/v1/routing/gateways/{namespace}/{name}:
    get:
      tags: [routing]
      summary: Gateway detail (summary enriched with live listeners + attached routes)
      parameters:
        - { $ref: '#/components/parameters/namespace' }
        - { $ref: '#/components/parameters/name' }
      responses:
        '200': { description: Gateway detail, content: { application/json: { schema: { $ref: '#/components/schemas/GatewayDetail' } } } }
        '404': { description: Unknown gateway }
        '503': { description: Kubernetes API unavailable }

  /api/v1/routing/httproutes:
    get:
      tags: [routing]
      summary: HTTPRoute list (first-class, #293; filter/pagination envelope)
      parameters:
        - { $ref: '#/components/parameters/nameQuery' }
        - { $ref: '#/components/parameters/namespaceQuery' }
        - { $ref: '#/components/parameters/status' }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
        - { $ref: '#/components/parameters/status' }
      responses:
        '200':
          description: HTTPRoute list envelope
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ListEnvelope' }
                  - type: object
                    properties:
                      httproutes:
                        type: array
                        items: { $ref: '#/components/schemas/HttpRouteSummary' }

  /api/v1/routing/ingresses:
    get:
      tags: [routing]
      summary: Ingress list (filter/pagination envelope)
      parameters:
        - { $ref: '#/components/parameters/nameQuery' }
        - { $ref: '#/components/parameters/namespaceQuery' }
        - { $ref: '#/components/parameters/status' }
        - { $ref: '#/components/parameters/limit' }
        - { $ref: '#/components/parameters/offset' }
        - { $ref: '#/components/parameters/status' }
      responses:
        '200':
          description: Ingress list envelope
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ListEnvelope' }
                  - type: object
                    properties:
                      ingresses:
                        type: array
                        items: { $ref: '#/components/schemas/IngressSummary' }

  /api/v1/routing/ingresses/{namespace}/{name}:
    get:
      tags: [routing]
      summary: Ingress detail (summary enriched with live load-balancer status)
      parameters:
        - { $ref: '#/components/parameters/namespace' }
        - { $ref: '#/components/parameters/name' }
      responses:
        '200': { description: Ingress detail, content: { application/json: { schema: { $ref: '#/components/schemas/IngressSummary' } } } }
        '404': { description: Unknown ingress }

  /api/v1/routing/routes/{kind}/{namespace}/{name}:
    get:
      tags: [routing]
      summary: Route detail — traffic-served status + effective config
      description: >
        Interpreted detail for a single route, sourced from the live Kubernetes
        object. HTTPRoute carries `hostnames`, per-parentRef `parent_statuses`
        (conditions), and `rules` (match predicates, weighted backends, filter
        kinds). Ingress carries `class`, inline `tls`, optional
        `default_backend`, `load_balancer` address, and `rules`
        (host/path/pathType → backend). Both carry the traffic-served `status`.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [httproute, ingress] }
        - { $ref: '#/components/parameters/namespace' }
        - { $ref: '#/components/parameters/name' }
      responses:
        '200': { description: Route detail (shape varies by kind) }
        '404': { description: Unknown kind or route }
        '503': { description: Kubernetes API unavailable }

  /api/v1/problems:
    get:
      tags: [cross-cutting]
      summary: Cross-cutting problem aggregate, namespaced by axis (#301)
      responses:
        '200':
          description: Problems
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problems' }

  /api/v1/topology:
    get:
      tags: [cross-cutting]
      summary: Discovery convergence topology — controller + connected proxy nodes (#379)
      responses:
        '200':
          description: >-
            Convergence snapshot, served by the leader. `discovery_active` is
            `false` on dev roles with no registry, which yields `nodes: []`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  discovery_active:
                    type: boolean
                    description: False on proxy roles (no discovery server / registry).
                  controller_version:
                    type: [string, 'null']
                    description: Current SharedPool snapshot version (content hash).
                  nodes:
                    type: array
                    items: { $ref: '#/components/schemas/TopologyNode' }
        '503':
          description: >-
            This replica is not the discovery leader, so it has no topology to
            report. Only the leader accepts proxy discovery streams; a standby's
            registry is empty rather than partial, so answering with an empty
            node list would be indistinguishable from a healthy cluster with
            nothing connected. Reach the leader through the
            `coxswain-controller-operator` Service.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }

  /api/v1/manifests/{kind}/{namespace}/{name}:
    get:
      tags: [cross-cutting]
      summary: Raw Kubernetes manifest for a resource
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [httproute, ingress, gateway, pod] }
        - { $ref: '#/components/parameters/namespace' }
        - { $ref: '#/components/parameters/name' }
      responses:
        '200': { description: Verbatim Kubernetes object (JSON) }
        '400': { description: Unknown kind }
        '404': { description: Not found }
        '503': { description: Kubernetes API unavailable }

  /api/v1/events:
    get:
      tags: [cross-cutting]
      summary: Server-Sent Events stream of cluster state changes
      responses:
        '200':
          description: SSE stream (rebuild/fleet/leadership/ownership events)
          content:
            text/event-stream: {}

  /api/v1/pods/{name}/logs:
    get:
      tags: [cross-cutting]
      summary: Chunked NDJSON log relay for a tracked pod
      parameters:
        - { $ref: '#/components/parameters/podName' }
        - { name: tail, in: query, schema: { type: integer } }
        - { name: follow, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Chunked NDJSON log stream }
        '404': { description: Pod not tracked in the fleet }
        '429': { description: Too many concurrent log streams }
        '503': { description: Kubernetes API unavailable }

components:
  parameters:
    nameQuery:
      name: name
      in: query
      description: Case-insensitive substring filter against the resource object name (routing list free-text search; name-only).
      schema: { type: string }
    namespaceQuery:
      name: namespace
      in: query
      description: Exact (case-insensitive) namespace filter for the routing lists (the operator UI's namespace dropdown).
      schema: { type: string }
    hostQuery:
      name: host
      in: query
      description: Exact (case-insensitive) host filter for the proxy route table — the operator UI's host dropdown (a pick from the proxy's known hosts). Also narrows the conflict list.
      schema: { type: string }
    pathQuery:
      name: path
      in: query
      description: Case-insensitive substring filter against the proxy route table's path — the operator UI's path search box. Also narrows the conflict list.
      schema: { type: string }
    limit:
      name: limit
      in: query
      description: Page size over the post-filter set. Default 200, max 1000.
      schema: { type: integer, default: 200, maximum: 1000 }
    offset:
      name: offset
      in: query
      schema: { type: integer, default: 0 }
    status:
      name: status
      in: query
      description: Set to `problem` to keep only rows whose health is not `ok`.
      schema: { type: string, enum: [problem] }
    namespace: { name: namespace, in: path, required: true, schema: { type: string } }
    name: { name: name, in: path, required: true, schema: { type: string } }
    podName: { name: name, in: path, required: true, schema: { type: string } }

  schemas:
    Severity:
      type: string
      enum: [ok, warn, error]
      description: >-
        Traffic-served health: `ok` = all paths serve, `warn` = partial/degraded,
        `error` = serves no traffic.

    CategorySummary:
      type: object
      description: Compact per-category aggregate (counts + worst severity).
      properties:
        total: { type: integer }
        worst: { $ref: '#/components/schemas/Severity' }

    NodeScope:
      type: object
      description: >-
        Discovery scope a proxy node serves. SharedPool nodes carry the
        cluster-wide table; Gateway nodes are dedicated to one Gateway.
      properties:
        kind: { type: string, enum: [SharedPool, Gateway] }
        namespace: { type: string, description: Present only when kind=Gateway. }
        name: { type: string, description: Present only when kind=Gateway. }
      required: [kind]

    TopologyNode:
      type: object
      description: A connected proxy node and its convergence state vs the controller.
      properties:
        node_id: { type: string, description: Proxy pod name (discovery node id). }
        scope: { $ref: '#/components/schemas/NodeScope' }
        last_acked_version:
          type: [string, 'null']
          description: Snapshot version the proxy last Ack'd (content hash); null until first ack.
        connected_since: { type: string, format: date-time }
        last_ack_at: { type: [string, 'null'], format: date-time }
        in_sync:
          type: boolean
          description: True when last_acked_version equals the scope's current target version.

    ListEnvelope:
      type: object
      description: >-
        Filter/pagination envelope shared by the list endpoints. The named item
        array (e.g. `gateways`) sits alongside these counts.
      properties:
        total: { type: integer, description: Post-filter, pre-limit count. }
        returned: { type: integer, description: Rows in this page. }
        offset: { type: integer }

    Health:
      type: object
      properties:
        version: { type: string, description: Coxswain version. }
        kubernetes_version: { type: string, description: Apiserver GitVersion; omitted when unavailable. }
        leader: { type: boolean, description: Whether this pod holds the leader-election lease. }
        subsystems: { type: object, additionalProperties: true }
        api_surfaces:
          type: object
          description: Which API surfaces are active on this pod role.
          properties:
            gateway_api: { type: boolean, description: Gateway API surface enabled (HTTPRoute, GatewayClass, etc.). }
            ingress: { type: boolean, description: Ingress surface enabled. }

    PodEntry:
      type: object
      description: >
        A fleet pod with its status; fields vary by role. Proxies and relays carry
        `ready` + `connected`; controllers carry `reachable`, because they run a
        discovery server rather than a client and so are still probed.
      properties:
        pod_name: { type: string }
        pod_namespace: { type: string }
        pod_ip: { type: string }
        telemetry_port: { type: integer }
        component: { type: string, enum: [controller, shared-proxy, dedicated-proxy, relay] }
        ready:
          type: boolean
          description: >
            Proxies and relays. The pod's Kubernetes `Ready` condition — kubelet's
            own verdict. Absent while the condition is unpublished (unknown, not a
            fault).
        connected:
          type: boolean
          description: >
            Proxies and relays. Whether the pod holds a live discovery stream. A
            pod can be `ready` and not `connected`: alive and serving traffic, but
            frozen on its last routing snapshot.
        reachable:
          type: boolean
          description: Controllers only. The peer `/statusz` probe succeeded.
        health:
          type: string
          enum: [ready, degraded]
          description: >
            Rollup. Absent when the pod has not reported — a pod that just
            connected, or one on a build predating health reporting. Absent means
            unknown, never unhealthy.
        degraded_checks: { type: array, items: { type: string } }
        version: { type: string, description: Reporting build's version; proxies and relays. }
        reported_at: { type: string, description: When the pod sampled its own health. }
        is_leader: { type: boolean, description: Controllers only. }
        gateway_ref: { type: string, description: Dedicated proxies only. }
        restarts: { type: integer }
        node: { type: string }
        phase: { type: string }
        created_at: { type: string }

    PodHealthRelay:
      type: object
      properties:
        pod_name: { type: string }
        ready: { type: boolean, description: Proxies and relays; kubelet's Ready condition. }
        connected: { type: boolean, description: Proxies and relays; holds a live discovery stream. }
        reachable: { type: boolean, description: Controllers only; the peer probe succeeded. }
        reported_at: { type: string }
        health:
          type: object
          additionalProperties: true
          description: >
            The pod's own subsystem tree. Absent when it has not reported yet.

    GatewaySummary:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        proxy:
          type: object
          properties:
            pool: { type: string, enum: [shared, dedicated] }
        route_count: { type: integer }
        addresses: { type: array, items: { type: string } }
        conditions: { type: array, items: { $ref: '#/components/schemas/Condition' } }
        status: { $ref: '#/components/schemas/Severity' }

    GatewayDetail:
      allOf:
        - { $ref: '#/components/schemas/GatewaySummary' }
        - type: object
          properties:
            listeners:
              type: array
              items:
                type: object
                properties:
                  name: { type: string }
                  port: { type: integer }
                  protocol: { type: string }
                  tls_enabled: { type: boolean }
                  tls_status:
                    description: Listener-precise TLS health (null for cleartext listeners); error = certificateRefs unresolved, warn = not programmed yet.
                    oneOf:
                      - { $ref: '#/components/schemas/Severity' }
                      - { type: 'null' }
                  tls_reason: { type: [string, 'null'], description: Reason/message when tls_status is not ok. }
                  attached_routes: { type: integer }
            attached_routes_list:
              type: array
              items:
                type: object
                properties:
                  kind: { type: string }
                  namespace: { type: string }
                  name: { type: string }
                  hostnames: { type: array, items: { type: string } }
                  rule_count: { type: integer }
                  status:
                    description: Reflector traffic-served status (null when the route is absent from the controller's table, e.g. a cut-over dedicated gateway — the UI then relies on the /problems overlay).
                    oneOf:
                      - { $ref: '#/components/schemas/Severity' }
                      - { type: 'null' }

    HttpRouteSummary:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        hostnames: { type: array, items: { type: string } }
        parent_gateways: { type: array, items: { type: string }, description: '`namespace/name` of attached Gateways.' }
        rule_count: { type: integer }
        status: { $ref: '#/components/schemas/Severity' }

    IngressSummary:
      type: object
      properties:
        name: { type: string }
        namespace: { type: string }
        route_count: { type: integer }
        load_balancer: { type: string, description: Omitted when unassigned. }
        ingress_class: { type: string, description: Claimed IngressClass; omitted when claimed via the default-class fallback. }
        status: { $ref: '#/components/schemas/Severity' }

    Condition:
      type: object
      properties:
        type: { type: string }
        status: { type: string, enum: ['True', 'False', 'Unknown'] }
        reason: { type: string }
        message: { type: string }

    Facets:
      type: object
      description: Distinct filter-dropdown values for a proxy's route table.
      properties:
        hosts: { type: array, items: { type: string } }
        namespaces: { type: array, items: { type: string } }
    RouteBlock:
      type: object
      description: Per-spec compiled routes; gains envelope counts when filtered.
      properties:
        hosts:
          type: array
          items:
            type: object
            properties:
              port: { type: integer }
              host: { type: string }
              routes:
                type: array
                items:
                  type: object
                  properties:
                    type: { type: string }
                    path: { type: string }
                    backend_group: { type: string }
                    namespace: { type: string }
                    name: { type: string }
                    endpoints: { type: array, items: { type: string } }
        conflicts:
          type: array
          items:
            type: object
            properties:
              port: { type: integer }
              host: { type: string }
              type: { type: string }
              path: { type: string }
              rejected_group: { type: string }
              namespace: { type: string }
              name: { type: string }
        total: { type: integer, description: Present only when filter/pagination params were supplied. }
        returned: { type: integer }
        offset: { type: integer }

    Problems:
      type: object
      properties:
        fleet:
          type: object
          properties:
            leaderless: { type: boolean, description: No reachable controller holds the lease. }
            not_ready:
              type: array
              description: The pod itself is down — kubelet says not Ready, or a controller peer did not answer.
              items: { $ref: '#/components/schemas/PodEntry' }
            disconnected:
              type: array
              description: >
                Ready and still serving, but holding no config stream — frozen on the
                last snapshot. One relay losing its stream puts its whole leaf subtree
                here at once.
              items: { $ref: '#/components/schemas/PodEntry' }
            degraded: { type: array, items: { $ref: '#/components/schemas/PodEntry' } }
        routing:
          type: object
          properties:
            conflicts:
              type: array
              items: { $ref: '#/components/schemas/Problem' }
            dead_routes:
              type: array
              items: { $ref: '#/components/schemas/Problem' }

    Problem:
      type: object
      properties:
        host: { type: string }
        path: { type: string }
